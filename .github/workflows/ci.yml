name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # node 只用于前端脚本语法检查（tests/test_frontend_static.py）
      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          APP_OFFLINE: "1"       # CI 不依赖大模型 / 外网
        run: |
          # 公开仓库不包含本地知识库（db/*.sqlite），因此无数据库时运行
          # 可复现的公开测试；有本地知识库时再执行完整回归套件。
          if [ -f db/dahua_kb.sqlite ]; then
            python -m pytest tests/ -q
          else
            python -m pytest \
              tests/test_calc.py \
              tests/test_frontend_static.py \
              tests/test_pointlist.py \
              tests/test_tender.py \
              tests/test_tenders_parser.py \
              tests/test_compare.py \
              tests/test_deviations.py \
              tests/test_sessions.py \
              tests/test_offline.py \
              tests/test_agent_service.py \
              tests/test_agent_tools.py \
              tests/test_agent_multi.py \
              tests/test_mcp.py \
              tests/test_evidence.py \
              -q
          fi
